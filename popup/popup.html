<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#dc2626" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      <line x1="11" y1="8" x2="11" y2="14"></line>
      <line x1="8" y1="11" x2="14" y2="11"></line>
    </svg>
  </div>

  <h1>AntiHumo</h1>
  <p class="tagline">Detector de clickbait argentino</p>

  <div class="status-row">
    <span class="dot" id="dot"></span>
    <span id="status-text">Verificando conexión…</span>
  </div>

  <label for="api-key">Tu clave API de Groq (opcional)</label>
  <div class="input-row">
    <input
      type="password"
      id="api-key"
      placeholder="gsk_xxxxxxxxxxxxxxxx"
      autocomplete="off"
      spellcheck="false"
    >
    <button id="toggle-visibility" title="Mostrar / ocultar">👁</button>
  </div>

  <div class="btn-row">
    <button id="save" class="btn-save">Guardar clave</button>
    <button id="reset" class="btn-reset">Restablecer</button>
  </div>

  <button id="test" class="btn-test">Probar análisis end-to-end</button>

  <p id="msg" class="msg"></p>

  <footer>
    Abrí cualquier nota y tocá el ícono de AntiHumo en la barra.
    <br>
    <a href="https://console.groq.com/keys" target="_blank">Obtener clave propia</a>
    &nbsp;·&nbsp;
    <a href="https://github.com" target="_blank">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
